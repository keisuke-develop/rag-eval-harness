# 評価セットの原稿。ここが人が編集する唯一の場所で、qa_set.jsonl は
# datasets/build_qa_set.py が生成する。
#
# なぜ原稿を分けるか:
#   正解根拠は文字オフセットで持つ（docs/02_evaluation.md「チャンクIDの安定性」）。
#   オフセットを手で書くと必ずずれるため、人は「根拠として引用する本文」を
#   そのまま書き、オフセットは機械に計算させる。
#   引用がコーパス中に1回しか現れないことも、生成時に検証される。
#
# 各項目:
#   qid        一意なID
#   question   質問文。コーパスの表現をそのまま写さない（生成時に重複を検査する）
#   doc        根拠がある文書の doc_id（answerable: false のときは書かない）
#   evidence   正解根拠。コーパス本文と1文字も違わない引用であること
#   factoid    固有名詞・数値を問う質問か。全体の半分以上が true であること
#   answerable 文脈に答えがあるか。省略時は true
#   note       answerable: false のときに、なぜ答えられないかを残す

version: "1.0"

questions:
  # ── doc01_fujisan ──────────────────────────────────────────────
  - qid: q001
    # 三角点の標高を問う形にすると、剣ヶ峰と富士白山の2点があり、さらに剣ヶ峰にも
    # 3775.56 m と 3775.51 m の2つの記載があるため答えが割れる。最高地点を問う形にした。
    question: "富士山でいちばん高い地点の標高は何メートルか。"
    doc: doc01_fujisan
    evidence: "したがって、この岩の標高は、3776.12 mとなり、これが富士山、および日本の最高標高である。"
    factoid: true

  - qid: q002
    question: "「郷土富士」と総称される山は、日本全国におよそ何座あるとされているか。"
    doc: doc01_fujisan
    evidence: "全国各地には、別称を含めて少なくとも340座といわれる「富士」と名の付く山があり、それらを「郷土富士」と呼ぶ。"
    factoid: true

  - qid: q003
    question: "富士山の南東斜面にある側火山は、西暦何年の噴火によって生まれたか。"
    doc: doc01_fujisan
    evidence: "宝永山（ほうえいざん）は宝永4年（1707年）の宝永大噴火で誕生した側火山（寄生火山）である。富士山南東斜面に位置し標高は2693 mである。"
    factoid: true

  - qid: q004
    question: "理化学研究所のフラッグシップ機の名称には、どのような意味が込められているか。"
    doc: doc01_fujisan
    evidence: "理化学研究所・計算科学研究センターが擁するフラッグシップスーパーコンピュータ「富岳」は、富士山の最高峰としての性能の高さと、すそ野の広さとしての汎用性の象徴として命名された。"
    factoid: false

  # ── doc02_photosynthesis ───────────────────────────────────────
  - qid: q005
    question: "photosynthesis という呼び方を最初に使ったのは誰で、それは何年のことか。"
    doc: doc02_photosynthesis
    evidence: "「光合成」という名称を初めて用いたのは、アメリカ合衆国の植物学者のチャールズ・バーネス（1893年）である。"
    factoid: true

  - qid: q006
    question: "植物の細胞にある葉緑体は、平均するとどれくらいの長さか。"
    doc: doc02_photosynthesis
    evidence: "葉緑体は細胞内に1個から1000個ほど存在し、大きさも形も様々だが、平均的な形状は、長さ約5 μmの回転楕円体状である。"
    factoid: true

  - qid: q007
    question: "ATPをつくる酵素は、1秒間に何回転しているか。"
    doc: doc02_photosynthesis
    evidence: "ATP合成酵素は1秒間に17回転し、ADPと遊離したリン酸から、ATPを合成しているのである。"
    factoid: true

  - qid: q008
    question: "酸素を出すタイプの光合成が、他のタイプと決定的に異なる点はどこか。"
    doc: doc02_photosynthesis
    evidence: "酸素発生型光合成経路の最大の特徴は「水分子を電子供与体として用いることができる」という点である。"
    factoid: false

  # ── doc03_hummingbird ──────────────────────────────────────────
  - qid: q009
    question: "地球上でいちばん小さい鳥はどの種で、体の長さはどれくらいか。"
    doc: doc03_hummingbird
    evidence: "キューバに生息するマメハチドリ Calypte helenae は世界最小の鳥であり、全長6センチメートル、体重2グラム弱しかない。"
    factoid: true

  - qid: q010
    question: "ハチドリが夜に深い眠りへ入ったとき、体温は何度まで下がるか。"
    doc: doc03_hummingbird
    evidence: "夜間の睡眠時（Torpor時）には、体温が40度から18度まで低下する"
    factoid: true

  - qid: q011
    question: "極端に長いくちばしを持つ種が、特定の花と結びつくことで得ている利点は何か。"
    doc: doc03_hummingbird
    evidence: "このように1対1のペアを形成することにより、ヤリハシハチドリは他のハチドリや昆虫との食料をめぐる競争を回避することができる。"
    factoid: false

  - qid: q012
    question: "野生で確認された最も長生きの個体は、何歳以上だったか。"
    doc: doc03_hummingbird
    evidence: "野生の寿命の最長記録は、フトオハチドリのメスで、1歳以降に識別足環がつけられ、その11年後に同じ足環の個体が捕獲されていることから、少なくとも12歳以上であることが確認された。"
    factoid: true

  # ── doc04_iss ──────────────────────────────────────────────────
  - qid: q013
    question: "国際宇宙ステーションが地球を1周するのにかかる時間はどれくらいか。"
    doc: doc04_iss
    evidence: "ISSは約91分で地球を一周し、1日あたり地球を15.5周回する。"
    factoid: true

  - qid: q014
    # 重量を問うと「419トン」と、別の節にある「約420トン」で答えが割れるため、
    # 同じ文にあって他に記載のないトラスの長さを問う形にした。
    question: "組み立てが完了した時点で、ISSの横方向のトラスは何メートルの長さになったか。"
    doc: doc04_iss
    evidence: "組立が完了した時点のISSは、体積1,200立方メートル、重量419トン、最大発生電力110キロワット、トラス（横方向）の長さ108.4メートル、進行方向の長さ74メートル、最大滞在人数は6名となった。"
    factoid: true

  - qid: q015
    question: "中国が自前の宇宙ステーションを持つことになった経緯はどのようなものか。"
    doc: doc04_iss
    evidence: "中国は2007年にISSへの参加を打診したが、アメリカの反対により認められず、独自の宇宙ステーションである「中国宇宙ステーション」を運用中である。"
    factoid: false

  - qid: q016
    question: "はじめて長期滞在する乗組員がステーションに着いたのはいつか。"
    doc: doc04_iss
    evidence: "最初のISSコンポーネントは1998年に打ち上げられ、最初の長期居住者は2000年10月31日にバイコヌール宇宙基地から打ち上げられた後、2000年11月2日に到着した。"
    factoid: true

  # ── doc05_tcp ──────────────────────────────────────────────────
  - qid: q017
    question: "IPのヘッダでTCPを示す番号はいくつか。"
    doc: doc05_tcp
    evidence: "その仕様はIETFによりRFC 9293 (STD 7) として標準化されている。なお、IPヘッダでのプロトコル番号は6である。"
    factoid: true

  - qid: q018
    question: "TCPのヘッダ部は、最小と最大でそれぞれ何バイトになるか。"
    doc: doc05_tcp
    evidence: "ヘッダの最小サイズは5ワードで、最大サイズは15ワードである。すなわち、ヘッダ部は20バイトから60バイトまでの大きさであり、21バイトめからの40バイトはオプションとなる。"
    factoid: true

  - qid: q019
    question: "音声通話のように遅れを嫌う用途で、このプロトコルが向かないとされるのはなぜか。"
    doc: doc05_tcp
    evidence: "TCPは完全性よりもリアルタイム性を求められるVoIPなどのアプリケーションには向いていない"
    factoid: false

  - qid: q020
    question: "TCPの元になった1974年の論文を書いたのは誰か。"
    doc: doc05_tcp
    evidence: "著者はヴィントン・サーフとロバート・カーンで、ノード間でパケット通信を使い資源を共有するインターネットワーキングのプロトコルを記述したものである。"
    factoid: true

  # ── doc06_solar_power ──────────────────────────────────────────
  - qid: q021
    question: "太陽光のパネルは何年ほどで寿命を迎えるとされているか。"
    doc: doc06_solar_power
    evidence: "環境省の「太陽光発電設備のリサイクル等の推進に向けたガイドライン」によると、太陽光パネルの製品寿命は約25～30年とされる。"
    factoid: true

  - qid: q022
    question: "2021年時点で、日本の太陽光による発電費用は1キロワット時あたりいくらか。"
    doc: doc06_solar_power
    evidence: "2021年において日本の太陽光発電のコストは1キロワット時13.5円（1ドル＝114円換算）である。これは5円の中国や6.5円のアメリカの2倍以上である。"
    factoid: true

  - qid: q023
    question: "どれくらいの規模の発電所が「メガソーラー」と呼ばれるか。"
    doc: doc06_solar_power
    evidence: "大規模な（特に設備容量が1メガワットを超える）太陽光発電所は「メガソーラー」とも呼ばれる。"
    factoid: true

  - qid: q024
    question: "太陽光の設備が燃えたとき、放水による消火がためらわれるのはなぜか。"
    doc: doc06_solar_power
    evidence: "太陽光発電は光があたると自然に発電するため、通電を止めることができずに、消火時の水を通して消防隊員が感電するおそれがある。"
    factoid: false

  # ── doc07_constitution ─────────────────────────────────────────
  - qid: q025
    question: "日本国憲法が公布された日と、効力を持ちはじめた日はいつか。"
    doc: doc07_constitution
    evidence: "1946年（昭和21年）11月3日公布、1947年（昭和22年）5月3日施行。"
    factoid: true

  - qid: q026
    question: "日本国憲法の条文は全部でいくつあり、いくつの章に分かれているか。"
    doc: doc07_constitution
    evidence: "日本国憲法の本文は、11章103条から構成されている。大別して、人権規定、統治規定、憲法保障の三つからなる。"
    factoid: true

  - qid: q027
    question: "三つの基本原理を「個人の尊厳」から導いて示した憲法学者は誰か。"
    doc: doc07_constitution
    evidence: "宮澤は日本国憲法の基本原理を「個人の尊厳」に求め、そこから導出される原理として、「基本的人権尊重」、「国民主権」、「平和国家」を示した。"
    factoid: true

  - qid: q028
    question: "国務請求権とも呼ばれる権利は、どのような内容の権利か。"
    doc: doc07_constitution
    evidence: "受益権とは、国務請求権ともいう。国民が国家に対し、行為や給付、制度の整備などを要求する権利である。"
    factoid: false

  # ── doc08_world_heritage ───────────────────────────────────────
  - qid: q029
    question: "世界遺産リストから最初に登録を取り消されたのはどの物件か。"
    doc: doc08_world_heritage
    evidence: "実際、2007年にはアラビアオリックスの保護区が初めて抹消された物件となった。"
    factoid: true

  - qid: q030
    question: "日本が世界遺産条約に加わったのは、何番目の締約国としてか。"
    doc: doc08_world_heritage
    evidence: "1992年は日本が世界遺産条約を批准した年でもあり、先進国では最後にあたる125番目の締約国となった"
    factoid: true

  - qid: q031
    question: "アスワン・ハイ・ダムで水没しかけた遺跡の救済に、日本はいくら拠出したか。"
    doc: doc08_world_heritage
    evidence: "50か国から、総事業費の半額に当たる約4,000万ドルの募金が集まり、日本からも28万ドルが寄せられた（日本政府が1万ドル、朝日新聞社が27万ドル）。"
    factoid: true

  - qid: q032
    question: "自然遺産の候補地を現地調査して勧告を出すのは、どの機関か。"
    doc: doc08_world_heritage
    evidence: "諮問機関として、文化遺産については国際記念物遺跡会議（ICOMOS）が、自然遺産については国際自然保護連合（IUCN）がそれぞれ現地調査を行い、それに基づいて勧告を出し"
    factoid: true

  # ── doc09_edo_period ───────────────────────────────────────────
  - qid: q033
    question: "徳川の幕府が続いたのは、およそ何年間か。"
    doc: doc09_edo_period
    evidence: "1868年10月23日（慶応4年／明治元年9月8日）の「一世一元の詔」の発布（一世一元への移行）に伴い、慶応から明治に改元されるまでの265年間である。"
    factoid: true

  - qid: q034
    question: "新井白石が定めた長崎貿易の制限で、オランダ船は年に何隻までとされたか。"
    doc: doc09_edo_period
    evidence: "清国船は年間30艘、交易額は銀6,000貫にまで、オランダ船は年間2隻、貿易額は3,000貫に制限され"
    factoid: true

  - qid: q035
    question: "18世紀のはじめごろ、江戸にはどれくらいの人が住んでいたか。"
    doc: doc09_edo_period
    evidence: "同期の江戸は、人口100万人前後に達しており、日本最大の消費都市であるばかりでなく、世界最大の都市でもあった。"
    factoid: true

  - qid: q036
    question: "松平定信が老中を退くころ、幕府の財政はどのような状態になっていたか。"
    doc: doc09_edo_period
    evidence: "最終的に6年たった定信失脚のころには備蓄金も20万両程に貯蓄することができており、幕府の赤字財政は黒字となっていた。"
    factoid: false

  # ── doc10_tokaido_shinkansen ───────────────────────────────────
  - qid: q037
    question: "東海道新幹線が営業をはじめたのはいつか。"
    doc: doc10_tokaido_shinkansen
    evidence: "1964年（昭和39年）10月1日に世界初の高速鉄道として開業し、日本の三大都市圏を東西につなぐ旅客鉄道輸送の動脈を担っている。"
    factoid: true

  - qid: q038
    question: "東京から新大阪までの実際の線路の長さは何キロか。"
    doc: doc10_tokaido_shinkansen
    evidence: "距離（実キロ）：515.4 km（営業キロは552.6 km）。"
    factoid: true

  - qid: q039
    question: "この路線はJR東海の運輸収入のうち、どれくらいの割合を占めるか。"
    doc: doc10_tokaido_shinkansen
    evidence: "JR東海の運輸収入の92%を稼ぎだすドル箱路線であり、45%という同社の高い営業利益率を生み出す日本屈指の高収益路線でもある（2019年度）。"
    factoid: true

  - qid: q040
    question: "通過列車があるのに本線へ直接ホームを設けている駅では、どのような安全対策がとられているか。"
    doc: doc10_tokaido_shinkansen
    evidence: "熱海駅は土地の制約条件などにより本線に直接ホームを設ける「2面2線」構造が採用されており、風圧事故防止のためホームドアの設置位置は線路から離れた場所になっている。"
    factoid: false

  # ── doc11_earthquake ───────────────────────────────────────────
  - qid: q041
    question: "震源までの距離を求める式を発表したのは誰で、それは何年のことか。"
    doc: doc11_earthquake
    evidence: "この算出式は大森房吉が1899年に発表したので、「（震源の）大森公式」と呼ばれている。"
    factoid: true

  - qid: q042
    question: "日本国内には、いまも動いている断層がおよそいくつあるとされるか。"
    doc: doc11_earthquake
    evidence: "一方、現在も動いている断層を活断層という。日本だけでも約2,000の活断層がある。"
    factoid: true

  - qid: q043
    question: "大正時代に関東を襲った地震では、どれくらいの広さの断層面ができたか。"
    doc: doc11_earthquake
    evidence: "1923年の関東地震では、神奈川県小田原直下付近から破壊が始まり、破壊は放射状に伝播して40 - 50秒で房総半島の端にまで至り、長さ130 km、幅70 kmの断層面を形成し"
    factoid: true

  - qid: q044
    question: "深いところで起きた地震は、地表の揺れ方にどのような特徴があるか。"
    doc: doc11_earthquake
    evidence: "震源が深い地震は同じ規模の浅い地震に比べて地表での揺れは小さい。ただし、地下構造の影響により震央から離れた地点で大きく揺れる異常震域が現れることがある。"
    factoid: false

  # ── doc12_washi ────────────────────────────────────────────────
  - qid: q045
    question: "戦前に1万を超えていた和紙のつくり手は、近年どこまで減ったか。"
    doc: doc12_washi
