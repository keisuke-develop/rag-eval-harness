# 実験006: 001〜005 の最良条件を組み合わせる
#
# この実験は実APIを使う。OPENAI_API_KEY が要る。
# 鍵なしで回せる同じ軸の条件は experiments/offline/006_best_combo.yaml にある
# （結果は docs/05_offline_results.md）。
#
# **各条件は 001〜005 を実APIで回してから確定する。** いまは仮置き。
run_id: "006_best_combo"
description: "001〜005 の最良条件を組み合わせる"

# ベースラインと最良条件を比べる実験なので、軸は当然複数になる。
multi_axis_reason: "個別の改善が積み上がるかを見る実験なので、各実験の最良条件をまとめて動かす"

dataset:
  corpus: "datasets/corpus"
  qa_set: "datasets/qa_set.jsonl"

variants:
  - label: "baseline"
    chunk: { size: 512, overlap: 64 }
    retrieve: { top_k: 5, rerank: false }
  - label: "best"
    chunk: { size: 512, overlap: 0 }
    retrieve: { top_k: 10, rerank: true }


fixed:
  chunk:
    size: 512
    overlap: 64
  embedder:
    provider: "openai"
    model: "text-embedding-3-small"
  store:
    # 近似最近傍だと、そのぶれが条件の差に混ざる。比較の道具としては総当たりを使う。
    kind: "memory"
  retrieve:
    top_k: 5
    rerank: false
  generate:
    provider: "openai"
    model: "gpt-4o-mini"
    temperature: 0.0
    seed: 42

metrics:
  - "recall_at_k"
  - "mrr"
  - "citation_match"
  - "abstention"
