# 実験003（外部APIに出ない条件）: top-k が検索精度に与える影響
#
# 001・002 で最良だった chunk 512 / overlap 0 に固定して、top-k だけを動かす。
#
# **この実験の本来の狙いは、ここでは半分しか達成できない。**
# docs/03_experiment_plan.md は「Recall は単調に上がるが、生成側は文脈が増えるほど
# 根拠一致率が落ちる点がある」というトレードオフの観察を狙いにしている。
# ダミー生成では生成側が測れないため、観察できるのは Recall と MRR が
# どう動くかまで。トレードオフの片側だけを見ていることを忘れないこと。
run_id: "offline_003_top_k"
description: "top-k が検索精度に与える影響（chunk 512/0 固定 / ダミー埋め込み）"

dataset:
  corpus: "datasets/corpus"
  qa_set: "datasets/qa_set.jsonl"

variants:
  - retrieve: { top_k: 3 }
  - retrieve: { top_k: 5 }
  - retrieve: { top_k: 10 }

fixed:
  chunk:
    size: 512
    overlap: 0
  embedder:
    provider: "hashing"
    model: "char-ngram"
    dim: 512
  store:
    kind: "memory"
  retrieve:
    top_k: 5
    rerank: false
  generate:
    provider: "quote"
    model: "top-hit-quote"

metrics:
  - "recall_at_k"
  - "mrr"
