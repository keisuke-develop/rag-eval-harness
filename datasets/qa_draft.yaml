    question: "いま残っているもののうち、世界でいちばん古い印刷物とされるのは何か。"
    doc: doc12_washi
    evidence: "中でも宝亀元年（770年）に作成された百万塔陀羅尼は、現存する世界最古の印刷物である。"
    factoid: true

