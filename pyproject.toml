[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "RAG の設定を変えたときの精度変化を、同じ評価セットで比較するための道具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keisuke Sumida" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "numpy>=2.0",
    "openai>=1.50",
]

# chromadb は既定では入れない。
# 理由: (1) どの実験でも使っていない（すべて store.kind: memory）
#       (2) 5件の未修正の脆弱性がある（認証前のコード実行を含む。修正版が存在しない）
#       (3) 依存だけで60以上のパッケージを引き込む
# いずれもサーバ機能の脆弱性で、プロセス内で使う限り経路は無いが、
# 使っていないものを既定で抱える理由もない。必要なら明示的に入れる:
#     uv sync --extra chroma
[project.optional-dependencies]
chroma = ["chromadb>=0.5"]

[project.scripts]
rageval = "rageval.cli:app"

[dependency-groups]
# 結果を S3 に置くためだけに使う。ライブラリ本体は AWS に依存しない。
# Docker イメージにはこのグループだけを足す（deploy/Dockerfile）。
deploy = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "truststore>=0.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rageval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: 外部依存をモックしたパイプライン通しのテスト"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S は flake8-bandit（SAST）。危ないAPIの使用を静的に検出する。
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# RUF001-003 は全角括弧などを「半角と紛らわしい」と警告する。
# コメント・docstring・利用者向けメッセージを日本語で書く方針なので、常に誤検知になる。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# テストでは assert を使う（S101）。
# 決定性の確認のために subprocess で子プロセスを起こす（S603/S607）。
# いずれも固定の引数しか渡さないので、外部入力が混ざる余地はない。
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "datasets", "deploy"]

# 型スタブを提供していない依存。ここでだけ緩める。
[[tool.mypy.overrides]]
module = ["chromadb.*", "truststore.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
