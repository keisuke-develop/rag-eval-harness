name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定のトークン権限は広い。このワークフローは読むだけで、
# issue もリリースもパッケージも触らないので、読み取りだけに絞る。
permissions:
  contents: read

# 同じ枝に続けて push したとき、古い実行を打ち切る。
# 結果を見ないものに Actions の時間を使わないため。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Docker イメージ（python:3.12-slim）と版を揃える。
    # 指定しないとランナーの既定に従うので、いつの間にか別の版で検証していることになる。
    # 回帰検証はスコアが1桁も動かないことを見るので、版が動くと意味が変わる。
    # 検査ツール（security ジョブの uvx）まで縛る理由は無いため、そちらには置かない。
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 既定では認証情報が .git/config に残る。この後 push しないので残さない。
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=rageval --cov-report=term-missing --cov-fail-under=95

  # セキュリティの検査。`check` と分けているのは、
  # 「コードが壊れている」と「脆弱性がある」を別々に見たいため。
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 既定では認証情報が .git/config に残る。この後 push しないので残さない。
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # check_templates.py が pyyaml を使う。
      - name: Sync dependencies
        run: uv sync --all-groups

      # 依存ライブラリの既知の脆弱性（SCA）。
      # ruff の S ルール（SAST）は自分たちのコードしか見ないので、両方要る。
      - name: Dependency vulnerabilities
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt --progress-spinner off

      # 使っているものの一覧を残す。脆弱性が後から公表されたときに影響範囲を追うため。
      - name: Generate SBOM
        run: uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

      # コミット対象のファイルに秘密情報が混ざっていないか。
      # public リポジトリなので、入ってからでは取り返しがつかない。
      # detect-secrets-hook は検出したら非ゼロで終わる。
      - name: Secret scan
        run: |
          uvx --from detect-secrets detect-secrets-hook \
            $(git ls-files --cached --others --exclude-standard)

      # detect-secrets は見本ファイル（.env.example など）を検査対象から外す。
      # 利用者には「.env.example を写して鍵を入れる」と案内しているので、
      # 間違えて見本のほうを書き換えるのがいちばん起こりやすい事故になる。
      # 実際に一度起きた。そこだけを見る検査を別に置く。
      - name: Real keys in files that detect-secrets skips
        run: uv run python tools/check_no_secrets.py

      # CloudFormation の記法（cfn-lint）とセキュリティ設定（checkov）。
      # cfn-lint はリンタでセキュリティ特化ではないので、両方通す。
      # checkov で意図的に見送った項目は、テンプレート側に理由つきで抑止を書いてある。
      - name: IaC lint
        run: uvx cfn-lint deploy/cloudformation/*.yaml

      - name: IaC security scan
        run: |
          uvx --from checkov checkov -d deploy/cloudformation \
            --framework cloudformation --compact --quiet

      # cfn-lint が見ない制約。セキュリティグループのルールの説明は ASCII のみ。
      # これを通り抜けてデプロイ時に落ちたことがある（deploy/VERIFICATION.md）。
      - name: Template constraints cfn-lint does not cover
        run: uv run python deploy/check_templates.py

      # ワークフロー自身の検査。ここを乗っ取られると、他の検査は全部素通りになる。
      # 書式（スキーマ）と、権限・ハッシュ固定などの設定の両方を見る。
      - name: Workflow lint
        run: |
          uvx check-jsonschema --builtin-schema vendor.github-workflows \
            .github/workflows/ci.yml
          uvx check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

      - name: Workflow security scan
        run: uvx zizmor --offline .github/workflows/

  # 評価の回帰検証。小さな固定評価セットで検索スコアを算出し、
  # ベースラインを下回ったら落とす。
  #
  # 閾値 0.50 は、実装時点で測った Recall@5 = 0.562 から余裕を取った値。
  # 到達目標ではなく「壊れていないこと」の下限として置いている。
  # 埋め込みは外部APIに出ない決定的な実装なので、この検証は実際のAPIを叩かない。
  eval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Docker イメージ（python:3.12-slim）と版を揃える。
    # 指定しないとランナーの既定に従うので、いつの間にか別の版で検証していることになる。
    # 回帰検証はスコアが1桁も動かないことを見るので、版が動くと意味が変わる。
    # 検査ツール（security ジョブの uvx）まで縛る理由は無いため、そちらには置かない。
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 既定では認証情報が .git/config に残る。この後 push しないので残さない。
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Sync dependencies
        run: uv sync --all-groups

      # コーパスを1文字でも動かすと評価セットの文字オフセットがずれる。
      # 生成物と原稿が食い違っていないことを、実験を回す前に確かめる。
      - name: Verify the evaluation set matches the corpus
        run: uv run python datasets/build_qa_set.py --check

      - name: Retrieval regression
        run: uv run rageval run experiments/ci_baseline.yaml --assert-recall-at-5 0.50

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-baseline-run
          path: runs/ci_baseline/
          retention-days: 7
          # 結果を書く前に落ちると runs/ が無い。
          # そこで赤くすると、本当の失敗がアップロードの失敗に埋もれる。
          if-no-files-found: ignore

  # イメージが実際に組み上がるか。
  # 手元に Docker を入れない方針なので、ここでしか確かめられない。
  # 作るだけで、どこにも push しない。ECR への push は CodeBuild の役目（deploy/）。
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 既定では認証情報が .git/config に残る。この後 push しないので残さない。
          persist-credentials: false

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rageval:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # イメージの中で実験が1本通ること。手元と同じスコアが出るかまでを見る。
      # RESULTS_BUCKET は渡さないので、S3 には何も送らない。
      - name: Run one experiment inside the image
        run: |
          docker run --rm rageval:ci experiments/ci_baseline.yaml | tee out.txt
          grep -q "0.562" out.txt || { echo "スコアが手元と違う"; exit 1; }

      # ライセンス本文がイメージの中の配布物に入っていること。
      # pyproject の license-files が指しているが、COPY を忘れても
      # ビルドは通ってしまい、静かに落ちる。
      - name: The license text ships with the package
        run: |
          docker run --rm rageval:ci --help >/dev/null
          docker run --rm --entrypoint sh rageval:ci -c \
            'ls /usr/local/lib/python3.12/site-packages/rag_eval_harness-*.dist-info/licenses/LICENSE'
